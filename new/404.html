<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<!-- GitHub Pages serves this for any missing address, at any depth, so every path starts at the root. -->
<script>try{if(localStorage.getItem("sm-theme")==="light"){document.documentElement.dataset.theme="light";document.querySelector('meta[name="theme-color"]').content="#FFFFFF";}}catch(e){}</script>
<title>Page not found | Sam Morgan</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://use.typekit.net/wpk2hzh.css">
<link rel="stylesheet" href="/css/site.css">
<style>
  body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: var(--bg); color: var(--fg); }
  .nf { display: flex; flex-direction: column; align-items: center; gap: 32px; padding: 24px; text-align: center; }
  .nf img { width: 260px; height: auto; margin: -40px 0; }  /* the logo render has room around the badge */
  .nf h1 { margin: 0; font-weight: 500; font-size: clamp(40px, 8vw, 96px); letter-spacing: -0.05em; line-height: 1.05; }
  .nf a {
    display: inline-flex; align-items: center; justify-content: center; min-width: 132px; height: 44px; padding: 0 24px;
    border-radius: 22px; border: 1px solid var(--pill-rim, transparent); background: var(--accent); color: var(--on-accent);
    font-weight: 400; font-size: 18px; letter-spacing: -0.05em; text-decoration: none;
  }
  .nf a:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  html[data-theme="light"] .nf .d, .nf .l { display: none; }
  html[data-theme="light"] .nf .l { display: block; }
</style>
</head>
<body>
<main class="nf">
  <img class="d" src="/img/logo/00.webp" alt="Sam Morgan" width="482" height="303">
  <img class="l" src="/img/logo-light/00.webp" alt="Sam Morgan" width="482" height="303">
  <h1>Page not found</h1>
  <a href="/">Home</a>
</main>
</body>
</html>
